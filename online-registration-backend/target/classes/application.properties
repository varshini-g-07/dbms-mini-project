# --- Spring Data Source Configuration (Essential for JDBC) ---

# 1. JDBC URL: Must include your database name (e.g., 'course_registration')
spring.datasource.url=jdbc:mysql://localhost:3306/course_registration?useSSL=false&serverTimezone=UTC

# 2. Database Username
spring.datasource.username=root 

# 3. Database Password
spring.datasource.password=faunandfloraas

# 4. JDBC Driver Class (Required for older versions, good for explicit clarity)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5. OPTIONAL: Show SQL queries in the console (very useful for debugging)
spring.jpa.show-sql=true