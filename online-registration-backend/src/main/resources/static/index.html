<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Course Registration</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #register-student-container {
            display: none;
        }

        #register-admin-container {
            display: none;
        }

        #student-container {
            display: none;
        }

        #admin-container {
            display: none;
        }
    </style>
</head>

<body>
    <div id="login-container">
        <h2>Login</h2>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div>
                <label for="email">Email</label>
                <input type="text" id="email" name="email">
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>
            <div>
                <label for="isAdmin">Admin</label>
                <input type="checkbox" id="isAdmin" name="isAdmin">
            </div>
            <button type="submit">Login</button>
            <div id="no-account-card">
                <p>Don't have an account?</p>
                <a href="#" onclick="showStudentRegistrationView(); return false;">Register as a Student</a><br />
                <a href="#" onclick="showAdminRegistrationView(); return false;">Register as an Admin</a>
            </div>
        </form>
    </div>

    <div id="register-student-container">
        <h2>Register Student</h2>
        <form id="register-student-form" onsubmit="handleStudentRegistration(event)">
            <div>
                <label for="student-first-name">First Name</label>
                <input type="text" id="student-first-name" name="first-name">
            </div>
            <div>
                <label for="student-last-name">Last Name</label>
                <input type="text" id="student-last-name" name="last-name">
            </div>
            <div>
                <label for="student-email">Email</label>
                <input type="text" id="student-email" name="email">
            </div>
            <div>
                <label for="student-password">Password</label>
                <input type="password" id="student-password" name="password">
            </div>
            <button type="submit">Register</button>
            <p>
                <a href="#" onclick="showLoginView(); return false;">Back to Login</a>
            </p>
        </form>
    </div>

    <div id="register-admin-container">
        <h2>Register Admin</h2>
        <form id="register-admin-form" onsubmit="handleAdminRegistration(event)">
            <div>
                <label for="admin-email">Email</label>
                <input type="text" id="admin-email" name="email">
            </div>
            <div>
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" name="password">
            </div>
            <button type="submit">Register</button>
            <p>
                <a href="#" onclick="showLoginView(); return false;">Back to Login</a>
            </p>
        </form>
    </div>
    <div id="student-container">
        <div id="student-details-container">
            <!-- Student data will be dynamically inserted here -->
            <p>Loading student information...</p>
        </div>
        <hr />
        <br />
        <div id="enrollment-form-container">
            <h2>Enroll in a New Course</h2>
            <form id="enrollment-form" onsubmit="handleEnrollmentEvent(event)">
                <div>
                    <label for="enrollment-student-id">Student ID</label>
                    <input type="text" id="enrollment-student-id" name="student-id">
                </div>
                <div>
                    <label for="enrollment-course-id">Course ID</label>
                    <input type="text" id="enrollment-course-id" name="course-id">
                </div>
                <div>
                    <label for="enrollment-year">Year</label>
                    <input type="text" id="enrollment-year" name="year">
                </div>
                <div>
                    <label for="enrollment-semester">Semester</label>
                    <input type="text" id="enrollment-semester" name="semester">
                </div>
                <button type="submit">Enroll</button>
            </form>
        </div>
    </div>
    <div id="admin-container">
        <div id="admin-details-container">
            <!-- Admin data will be dynamically inserted here -->
            <p>Loading admin information...</p>
        </div>
        <div id="course-form-container">
            <h1>Add New Course</h1>
            <form id="add-course-form" onsubmit="handleCourseAddition(event)">
                <div>
                    <label for="add-course-id">Course ID</label>
                    <input type="text" id="add-course-id" name="course-id">
                </div>
                <div>
                    <label for="add-course-name">Course Name</label>
                    <input type="text" id="add-course-name" name="course-name">
                </div>
                <div>
                    <label for="add-course-partner">Partner</label>
                    <input type="text" id="add-course-partner" name="partner">
                </div>
                <div>
                    <label for="add-course-rating">Rating</label>
                    <input type="text" id="add-course-rating" name="rating">
                </div>
                <div>
                    <label for="add-course-certificate-type">Certificate Type</label>
                    <input type="text" id="add-course-certificate-type" name="certificate-type">
                </div>
                <div>
                    <label for="add-course-duration">Duration</label>
                    <input type="text" id="add-course-duration" name="duration">
                </div>
                <button type="submit">Add</button>
            </form>
        </div>
        <div id="delete-course-form-container">
            <h1>Delete Course from Catalog</h1>
            <form id="delete-course-form" onsubmit="handleCourseDeletion(event)">
                <div>
                    <label for="delete-course-id">Course ID</label>
                    <input type="text" id="delete-course-id" name="course-id" required>
                </div>
                <button type="submit" class="delete-action-btn">Delete Course</button>
            </form>
        </div>
    </div>
    <div id="toast-container"></div>
    <script src="script.js"></script>
</body>

</html>
