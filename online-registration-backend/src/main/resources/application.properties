# --- Spring Data Source Configuration (Essential for JDBC) ---

# 1. JDBC URL
spring.datasource.url=jdbc:mysql://localhost:3306/dbms-miniproject?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Database Username
spring.datasource.username=root

# 3. Database Password
spring.datasource.password=password123

# 4. JDBC Driver Class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
